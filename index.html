
<!DOCTYPE html>
<html>
<head>
  <title>VR Arrow Key Controller</title>
  <script src="script.js" defer></script>
  <style>
    #controls {
      display: grid;
      grid-template-columns: 60px 60px 60px;
      grid-template-rows: 60px 60px 60px;
      gap: 5px;
      justify-content: center;
      margin-top: 20px;
    }
    button {
      font-size: 18px;
      cursor: pointer;
    }
    #searchBox {
      width: 80%;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h1>VR Arrow Key Controller</h1>
  <input type="text" id="searchBox" placeholder="Type your query" />

  <div id="controls">
    <div></div>
    <button onclick="arrowKey('up')">↑</button>
    <div></div>

    <button onclick="arrowKey('left')">←</button>
    <div></div>
    <button onclick="arrowKey('right')">→</button>

    <div></div>
    <button onclick="arrowKey('down')">↓</button>
    <div></div>
  </div>

  <button onclick="searchGoogle()">Search Google</button>
</body>
</html>
